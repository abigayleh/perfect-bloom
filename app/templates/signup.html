{% extends "base.html" %}
{% block title %}Sign up — perfect bloom{% endblock %}

{% block content %}
  <h1>Sign up</h1>

  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}

  <form method="post" action="/signup" class="stack">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required>

    <label for="password">Password</label>
    <input id="password" name="password" type="password" autocomplete="new-password"
           minlength="10" required>
    <p class="hint">At least 10 characters.</p>

    <label for="timezone">Time zone</label>
    <select id="timezone" name="timezone" required>
      {% for tz in timezones %}<option value="{{ tz }}">{{ tz }}</option>{% endfor %}
    </select>
    <p class="hint">Reminders arrive at noon here.</p>

    <button type="submit">Create account</button>
  </form>

  <p class="muted">Already have an account? <a href="/login">Log in</a>.</p>

  <script>
    // Preselect the browser's zone; the select stays usable without JS.
    const zone = Intl.DateTimeFormat().resolvedOptions().timeZone;
    const field = document.getElementById("timezone");
    if (zone && [...field.options].some((o) => o.value === zone)) field.value = zone;
  </script>
{% endblock %}
